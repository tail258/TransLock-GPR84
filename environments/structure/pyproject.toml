[project]
name = "translock-gpr84"
version = "0.1.0"
description = "公开数据驱动的 GPR84 拮抗剂筛选与机制验证流程"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "biopython>=1.88",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mdanalysis>=2.10.0",
    "mdtraj>=1.11.1.post2",
    "meeko>=0.8.0",
    "numpy>=2.4.6",
    "openmm[cuda12]>=8.6.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "parmed>=4.3.1",
    "pdbfixer>=1.12.0",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "prolif>=2.2.1",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
    "vina>=1.2.7",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "snakemake>=9.26.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/translock_gpr84"]
[tool.uv]
package = false
environments = [
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
