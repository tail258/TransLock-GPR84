[project]
name = "translock-membrane-md"
version = "0.1.0"
description = "隔离的完整膜体系准备与OpenFF参数环境"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pandas==2.3.3",
  "pyyaml==6.0.3",
  "openmm[cuda12]==8.6.0",
  "pdbfixer==1.12.0",
  "rdkit==2026.3.5",
  "torch==2.5.1",
  "pytorch-lightning==2.5.6",
  "dgl==1.1.3",
  "pydantic>=2.7,<3",
  "pint>=0.24,<0.26",
  "networkx>=3,<4",
  "cachetools",
  "xmltodict",
  "python-constraint",
  "msgpack",
  "packaging",
  "importlib-resources",
  "matplotlib",
  "pytest",
  "openff-toolkit",
  "openff-units",
  "openff-utilities",
  "openff-interchange",
  "openforcefields",
  "openff-nagl",
  "openff-nagl-models",
  "openmmforcefields",
  "tinydb>=4.9.0",
  "lxml>=6.1.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
openff-toolkit = { git = "https://github.com/openforcefield/openff-toolkit.git", tag = "0.18.0" }
openff-units = { git = "https://github.com/openforcefield/openff-units.git", tag = "0.3.1" }
openff-utilities = { git = "https://github.com/openforcefield/openff-utilities.git", tag = "v0.1.16" }
openff-interchange = { git = "https://github.com/openforcefield/openff-interchange.git", tag = "v0.4.7" }
openforcefields = { git = "https://github.com/openforcefield/openff-forcefields.git", tag = "2026.01.0" }
openff-nagl = { git = "https://github.com/openforcefield/openff-nagl.git", tag = "v0.5.4" }
openff-nagl-models = { git = "https://github.com/openforcefield/openff-nagl-models.git", tag = "v2025.09.0" }
openmmforcefields = { git = "https://github.com/openmm/openmmforcefields.git", tag = "0.15.1" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
